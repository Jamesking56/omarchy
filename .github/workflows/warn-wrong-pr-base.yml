name: Warn on wrong PR base

env:
  DEFAULT_BRANCH: quattro

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.pull_request.base.ref != env.DEFAULT_BRANCH
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `This pull request targets \`${context.payload.pull_request.base.ref}\`. Please open it against \`${process.env.DEFAULT_BRANCH}\` instead.`,
            });
